    <!-- Matches the bar the browser paints around the app in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#110f0c" />

    <script>
      // Runs before first paint so a forced theme does not flash the other one.
      try {
        var t = localStorage.getItem('hq-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>

    <!--
      The launch screen the app draws for itself, in the same colours and with
      the same mark as the one the operating system shows. The OS splash goes
      the moment the page exists, which is a beat before React has rendered
      anything — this covers that beat, so the two read as one movement rather
      than a flash of empty page between them.

      Inline rather than in the stylesheet: it has to paint before the bundle
      and the CSS have been fetched, which is the whole point of it.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: #fcfaf7;
        transition: opacity 260ms ease;
      }
      /* Roughly the size the mark has on the iOS launch image, so it does not
         jump when one hands over to the other. */
      #boot svg {
        width: min(25vmin, 96px);
        height: auto;
        color: #a35d2e;
        transition: transform 280ms ease;
      }
      /* The mark draws itself: the ring first, then the figure inside it.
         Every path carries pathLength="1", so one dash length covers any
         stroke however long it really is and the timings below are the same
         for all of them. */
      #boot path {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: boot-draw 420ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #boot g:nth-of-type(1) path:nth-child(2) { animation-delay: 45ms; }
      #boot g:nth-of-type(1) path:nth-child(3) { animation-delay: 90ms; }
      #boot g:nth-of-type(1) path:nth-child(4) { animation-delay: 135ms; }
      #boot g:nth-of-type(2) path:nth-child(1) { animation-delay: 120ms; }
      #boot g:nth-of-type(2) path:nth-child(2) { animation-delay: 165ms; }
      #boot g:nth-of-type(2) path:nth-child(3) { animation-delay: 210ms; }
      #boot g:nth-of-type(2) path:nth-child(4) { animation-delay: 255ms; }
      @keyframes boot-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /* On the way out the mark grows a little as the ground fades, so the
         page underneath reads as coming forward rather than the cover simply
         switching off. */
      #boot[data-going] {
        opacity: 0;
      }
      #boot[data-going] svg {
        transform: scale(1.08);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #boot {
          background: #110f0c;
        }
      }
      :root[data-theme='dark'] #boot {
        background: #110f0c;
      }
      /* Asked for no animation: the mark is simply there, whole, and the cover
         is taken away without a fade. */
      @media (prefers-reduced-motion: reduce) {
        #boot,
        #boot svg {
          transition: none;
        }
        #boot path {
          animation: none;
          stroke-dashoffset: 0;
        }
      }
    </style>

    <div id="root"></div>
    <div id="boot">

        aria-label="HQ"

        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
